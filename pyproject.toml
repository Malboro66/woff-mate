[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "woff"
dynamic = ["version"]
description = "WoFF BHaH II Watchdog data extraction and campaign persistence tools"
requires-python = ">=3.10,<3.15"
dependencies = [
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = [
    "psutil>=5.9",
    "PyYAML>=6.0",
    "pyright>=1.1.400",
    "pytest>=7.0",
]
windows = ["pywin32>=306; platform_system == 'Windows'"]

[project.scripts]
woff-watchdog = "woff.woff_watchdog:main"
woff-report = "woff.gerar_relatorio:main"

[tool.setuptools.packages.find]
include = ["woff*"]
exclude = ["woff.tests", "woff.tests.*"]

[tool.setuptools.dynamic]
version = {attr = "woff.version.__version__"}
