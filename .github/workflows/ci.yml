name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m pip install pytest psutil PyYAML
      - run: python -m pip install build
      - name: Validate engineering governance
        run: |
          python scripts/validate_project_graph.py
          python -m pytest woff/tests/test_architecture_contracts.py -q
      - name: Build and inspect wheel
        run: |
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              packaged = archive.namelist()
          forbidden = [
              name for name in packaged
              if name.endswith("conftest.py") or name.startswith("woff/tests/")
          ]
          if forbidden:
              raise SystemExit(f"Test files found in wheel: {forbidden}")
          PY
      - name: Import every installed module
        shell: python {0}
        working-directory: ${{ runner.temp }}
        run: |
          import importlib
          import pkgutil
          import woff

          for module in pkgutil.walk_packages(woff.__path__, woff.__name__ + "."):
              importlib.import_module(module.name)
      - name: Exercise installed entry points safely
        shell: bash
        run: |
          woff-watchdog --help
          woff-query --help
          woff-report --help
      - run: python -m pytest -q

  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/python -m pip install ".[dev]"
      - run: .venv/bin/pyright

  windows-smoke:
    name: Windows smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m pip install pyinstaller pytest
      - name: Exercise pilot-slot lifecycle on Windows
        run: python -m pytest woff/tests/test_pilot_vacancy.py -q
      - name: Exercise output-path isolation on Windows
        run: python -m pytest woff/tests/test_output_path_isolation.py -q
      - name: Import every installed module
        shell: python {0}
        working-directory: ${{ runner.temp }}
        run: |
          import importlib
          import pkgutil
          import woff

          for module in pkgutil.walk_packages(woff.__path__, woff.__name__ + "."):
              importlib.import_module(module.name)
      - name: Exercise installed entry points safely
        shell: pwsh
        run: |
          @'
          import json
          import os
          import subprocess
          from pathlib import Path

          from woff.config import WatchdogConfig
          from woff.database import DatabaseManager
          from woff.woff_watchdog import WoFFWatchdog

          smoke_root = Path(os.environ["RUNNER_TEMP"]) / "woff-command-smoke"
          source_root = smoke_root / "source"
          output_root = smoke_root / "outputs"
          work_root = smoke_root / "work"
          source_root.mkdir(parents=True, exist_ok=True)
          output_root.mkdir(parents=True, exist_ok=True)
          work_root.mkdir(parents=True, exist_ok=True)
          database_path = output_root / "empty.sqlite"
          DatabaseManager(str(database_path)).close()
          config_path = work_root / "config.json"
          config = WatchdogConfig(
              watch_paths=[str(source_root)],
              export_path=str(database_path),
              backup_export=True,
          )
          config_path.write_text(json.dumps(config.to_dict()), encoding="utf-8")
          environment = os.environ.copy()
          environment["PYTHONIOENCODING"] = "utf-8"

          watchdog = WoFFWatchdog(config)
          watchdog.stop()
          assert database_path.with_name(
              f"{database_path.name}.backup.sqlite"
          ).is_file()

          query = subprocess.run(
              ["woff-query", "--db", str(database_path), "--format", "json"],
              env=environment,
              capture_output=True,
              text=True,
              encoding="utf-8",
          )
          assert query.returncode == 0, query.stderr
          assert json.loads(query.stdout) == []

          report = subprocess.run(
              ["woff-report", "--config", str(config_path)],
              cwd=work_root,
              env=environment,
              capture_output=True,
              text=True,
              encoding="utf-8",
          )
          assert report.returncode == 0, report.stderr
          assert (work_root / "woff_data_report.txt").is_file()

          parse = subprocess.run(
              [
                  "woff-watchdog",
                  "--config",
                  str(config_path),
                  "--parse-file",
                  str(work_root / "missing.xml"),
              ],
              env=environment,
              capture_output=True,
              text=True,
              encoding="utf-8",
          )
          assert parse.returncode == 2, (parse.stdout, parse.stderr)
          '@ | python -
      - name: Validate PyInstaller launcher
        run: python .\woff_watchdog_entry.py --help
      - name: Build Windows executable
        run: pyinstaller --clean --noconfirm build.spec
      - name: Smoke test packaged executable
        run: .\dist\WoFFWatchdog\WoFFWatchdog.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: WoFFWatchdog-windows-python-3.10
          path: dist/WoFFWatchdog/
          if-no-files-found: error
          retention-days: 3
