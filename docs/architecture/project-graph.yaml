version: 1
updated: 2026-08-26

project:
  repository: Malboro66/woff-mate
  operational_board: https://github.com/users/Malboro66/projects/1
  approved_plan: WoFF Mate Master Plan, approved 2026-08-13
  source_of_truth:
    - The main branch and its CI define the final technical state.
    - This graph defines modules, invariants, work dependencies, evals, and gates.
    - GitHub Projects is the operational view and does not replace repository evidence.

source_files:
  include:
    - "*.py"
    - woff/**/*.py
    - scripts/**/*.py
  exclude:
    - woff/tests/**/*.py

modules:
  foundation:
    responsibility: Package identity, canonical versions, and stable campaign namespace primitives.
    paths:
      - woff/__init__.py
      - woff/campaign_namespace.py
      - woff/command_contract.py
      - woff/version.py
    may_depend_on: []
    forbidden_dependencies:
      - domain
      - persistence
      - ingestion
      - application
      - platform
      - presentation

  domain:
    responsibility: Campaign entities, normalization, RPG rules, and narratives.
    paths:
      - woff/identity.py
      - woff/maps.py
      - woff/models.py
      - woff/narrative_generator.py
      - woff/normalization.py
      - woff/rpg_system.py
    may_depend_on:
      - foundation
    forbidden_dependencies:
      - persistence
      - ingestion
      - application
      - platform
      - presentation

  persistence:
    responsibility: SQLite lifecycle, transactions, schema, and repositories.
    paths:
      - woff/database.py
      - woff/repositories/**/*.py
    may_depend_on:
      - foundation
      - domain
    forbidden_dependencies:
      - ingestion
      - application
      - platform
      - presentation

  platform:
    responsibility: Local configuration and Windows integration.
    paths:
      - woff/config.py
      - woff/win_registry.py
    may_depend_on:
      - foundation
    forbidden_dependencies:
      - persistence
      - ingestion
      - application
      - presentation

  ingestion:
    responsibility: Decode, parse, catalog, and schedule bounded WoFF file ingestion.
    paths:
      - woff/decode/**/*.py
      - woff/decode_dossier.py
      - woff/decode_squad.py
      - woff/discovery.py
      - woff/medal_cataloger.py
      - woff/ingestion/**/*.py
      - woff/parsers/**/*.py
      - woff/squadron_cataloger.py
    may_depend_on:
      - foundation
      - domain
      - persistence
      - platform
    forbidden_dependencies:
      - application
      - presentation

  application:
    responsibility: Coordinate campaign processing and watchdog activity.
    paths:
      - woff/campaign_engine.py
      - woff/handler.py
      - woff/woff_watchdog.py
    may_depend_on:
      - foundation
      - domain
      - persistence
      - ingestion
      - platform
    forbidden_dependencies:
      - presentation

  presentation:
    responsibility: User-facing commands, reports, diagnostics, and diary editing.
    paths:
      - diagnostico.py
      - woff_editor.py
      - woff_query.py
      - woff_watchdog_entry.py
      - woff/career_selection.py
      - woff/gerar_relatorio.py
    may_depend_on:
      - foundation
      - domain
      - persistence
      - ingestion
      - application
      - platform
    forbidden_dependencies: []

  governance:
    responsibility: Executable repository policy and project graph validation.
    paths:
      - scripts/validate_project_graph.py
    may_depend_on: []
    forbidden_dependencies:
      - foundation
      - domain
      - persistence
      - ingestion
      - application
      - platform
      - presentation

invariants:
  DATA-001:
    statement: No operation may delete or modify data belonging to another pilot.
    enforced_by:
      - woff/tests/test_career_selection.py
      - woff/tests/test_woff_editor.py
  DATA-002:
    statement: Every schema change requires backup, migration validation, rollback, and a reopen test.
    enforced_by:
      - woff/tests/test_database_manager.py
      - woff/tests/test_numeric_fields_migration.py
  PRIV-001:
    statement: WoFF-derived and user-local data remains on the user's machine by default and is not automatically transmitted to third parties.
    enforced_by:
      - woff/tests/test_privacy_contracts.py
  LIC-001:
    statement: WoFF activation, serial, product-key, license, and equivalent credentials are forbidden data and are never intentionally read, enumerated, stored, logged, exported, or transmitted.
    enforced_by:
      - woff/tests/test_privacy_contracts.py
  NET-001:
    statement: Core WoFF Mate functionality operates offline without external telemetry, analytics, tracking, automatic upload, or automatic crash-report transmission; local watchdog monitoring of approved WoFF-generated files is permitted.
    enforced_by:
      - woff/tests/test_privacy_contracts.py

gates:
  Q0:
    description: Work is reproducible, scoped, dependency-aware, and ready for implementation.
  Q1:
    description: Focused tests, related tests, full suite, Pyright, and diff review pass.
  Q2:
    description: Database and data changes prove backup, rollback, integrity, and reopen behavior.
  Q3:
    description: File and concurrency changes prove bounded queues, retries, snapshots, moves, and shutdown.
  Q4:
    description: Windows and packaging changes pass supported Python, smoke, build, install, upgrade, and rollback checks.
  Q5:
    description: Product decision gates approve data reliability, launcher viability, social core, or public release.
  Q6-CYCLE-3.3.0:
    description: All fifteen 3.3.0 work items, applicable evals, functional exit criteria, documentation, and CI are approved.
  Q6-CYCLE-3.4.0:
    description: All thirteen 3.4.0 work items, applicable evals, functional exit criteria, documentation, and CI are approved.

